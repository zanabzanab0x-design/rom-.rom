    <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button class="send-btn" id="sendBtn">إرسال</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    // دالة إضافة رسالة جديدة للشاشة
    function appendMessage(text, type) {
        if (text.trim() === '') return;

        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', type);
        messageDiv.textContent = text;
        
        chatMessages.appendChild(messageDiv);
        
        // التمرير التلقائي لأسفل المحادثة
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // معالجة حدث الإرسال
    function handleSend() {
        const messageText = chatInput.value;
        if(messageText.trim() !== "") {
            appendMessage(messageText, 'sent');
            chatInput.value = '';

            // محاكاة رد تلقائي بسيط بعد ثانية واحدة (للردود الواردة)
            setTimeout(() => {
                appendMessage("تم استلام رسالتك بنجاح! 👍", 'received');
            }, 1000);
        }
    }

    // تشغيل الإرسال عند النقر على الزر
    sendBtn.addEventListener('click', handleSend);

    // تشغيل الإرسال عند الضغط على زر Enter
    chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handleSend();
        }
    });
</script>

</body>
</html>
