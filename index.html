<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- 
      تطوير وتخصيص هذا الكود بالكامل بواسطة: المطور كرامه
      جميع الحقوق محفوظة للمالك: كرامه © 2026
      نسخة التحكم الكامل والخصوصية التامة
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات كرامه المميز - دردشة فورية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');
        * { font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: white; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* رتبة المالك الحصري - كرامه */
        .glow-owner {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowFlow 3s linear infinite, glowPulse 1.5s ease-in-out infinite;
            font-weight: 900;
            font-size: 1.15em;
            filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.8)) drop-shadow(0 0 20px rgba(0, 255, 255, 0.6));
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
            50% { background-position: 100% 50%; filter: hue-rotate(180deg); }
            100% { background-position: 0% 50%; filter: hue-rotate(360deg); }
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .rank-master { color: #ef4444; font-weight: 800; }
        .rank-super { color: #22c55e; font-weight: 800; }
        .rank-root { color: #f97316; font-weight: 800; }
        .rank-user { color: #ffffff; font-weight: 600; }
        .rank-guest { color: #94a3b8; font-weight: 600; }

        .message-appear { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden justify-between">

    <!-- شريط الرأس الافتراضي -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2.5 rounded-xl shadow-md shadow-indigo-500/20">
                <i class="fa-solid fa-comments text-xl text-white"></i>
            </div>
            <div>
                <h1 id="chatTitle" class="font-bold text-lg text-white">شات كرامه الرسمي</h1>
                <p id="chatWelcome" class="text-xs text-slate-400">أهلاً بك في فضاء كرامه الخاص</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleAdminPanel()" id="adminBtn" class="hidden bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                <i class="fa-solid fa-screwdriver-wrench"></i> لوحة تحكم كرامه
            </button>
            <span class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-500/20 flex items-center gap-1.5">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> متصل
            </span>
        </div>
    </header>

    <!-- منطقة الشات الرئيسية -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide" id="chatArea">
        <!-- ترحيب المالك التلقائي -->
        <div class="flex items-start gap-3 message-appear bg-slate-800/40 p-3 rounded-2xl border border-slate-700/50 max-w-[85%]">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-600 flex items-center justify-center font-bold text-white shadow-md">👑</div>
            <div class="flex-1">
                <div class="flex items-center gap-2 mb-1">
                    <span class="glow-owner"><i class="fa-solid fa-crown"></i> كرامه (المالك)</span>
                    <span class="text-[10px] text-slate-500">الآن</span>
                </div>
                <p id="welcomeMessage" class="text-sm text-slate-200 leading-relaxed">مرحباً بكم في منصتي الخاصة. هذا الشات يخضع لإدارتي وتحكمي الكامل بنسبة 100%.</p>
            </div>
        </div>
    </main>

    <!-- لوحة تحكم المالك المخفية (كرامه فقط) -->
    <div id="adminPanel" class="hidden bg-slate-900 border-t border-rose-500/30 p-4 space-y-3 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <h3 class="text-rose-400 font-bold text-sm flex items-center gap-1"><i class="fa-solid fa-user-gear"></i> أدوات تحكم المالك (كرامه)</h3>
            <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-white text-xs">إغلاق ×</button>
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs">
            <button onclick="changeChatSettings('title')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded border border-slate-700 text-right">تغيير اسم الشات الرئيسي</button>
            <button onclick="changeChatSettings('welcome')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded border border-slate-700 text-right">تغيير رسالة الترحيب</button>
            <button onclick="clearChat()" class="bg-rose-950/40 text-rose-400 hover:bg-rose-900/50 p-2 rounded border border-rose-800 text-right">مسح كافة الرسائل</button>
            <button onclick="simulateUser()" class="bg-emerald-950/40 text-emerald-400 hover:bg-emerald-900/50 p-2 rounded border border-emerald-800 text-right">دخول عضو وهمي للتجربة</button>
        </div>
    </div>

    <!-- شريط إدخال الرسائل -->
    <footer class="bg-slate-900 p-4 border-t border-slate-800 shadow-xl">
        <form id="chatForm" onsubmit="handleSend(event)" class="flex gap-2">
            <input type="text" id="msgInput" placeholder="اكتب رسالتك هنا..." autocomplete="off" class="flex-1 bg-slate-800 text-white placeholder-slate-500 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700/60 transition">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 rounded-xl transition flex items-center justify-center shadow-lg shadow-indigo-600/20">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </footer>

    <script>
        // إعدادات المالك الحصرية - كرامه
        const ADMIN_NAME = "كرامه";
        let currentUserName = "";
        let currentUserRank = "rank-user"; 

        // نافذة منبثقة فورية لتحديد هوية المستخدم
        window.addEventListener('DOMContentLoaded', () => {
            let identity = prompt("من فضلك أدخل اسمك لدخول الشات:", "زائر");
            if (!identity || identity.trim() === "") identity = "عضو مجهول";
            
            currentUserName = identity.trim();

            // التعرف التلقائي الذكي على المالك كرامه وثبيت صلاحياته وثقله البرمجي
            if (currentUserName === ADMIN_NAME) {
                currentUserRank = "glow-owner";
                document.getElementById('adminBtn').classList.remove('hidden');
                alert("أهلاً بك يا زعيم! تم التعرف عليك بصفتك المالك (كرامه). تم تفعيل لوحة تحكمك السرية بنجاح.");
            } else {
                // رتبة عشوائية لباقي الأعضاء لإعطاء مظهر تفاعلي للشات
                const ranks = ["rank-master", "rank-super", "rank-root", "rank-user"];
                currentUserRank = ranks[Math.floor(Math.random() * ranks.length)];
            }
        });

        // معالجة وإرسال الرسائل
        function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(currentUserName, currentUserRank, text);
            input.value = '';

            // رد تلقائي ذكي يحاكي التفاعل من الأعضاء
            if (currentUserName !== ADMIN_NAME && Math.random() > 0.4) {
                setTimeout(() => {
                    appendMessage("المشرف التلقائي", "rank-root", `أهلاً بك يا ${currentUserName} في شات المالك كرامه! شرفتنا.`);
                }, 1000);
            }
        }

        // إضافة الرسالة إلى واجهة الشات
        function appendMessage(name, rankClass, messageText) {
            const chatArea = document.getElementById('chatArea');
            const msgHtml = `
                <div class="flex items-start gap-3 message-appear bg-slate-800/20 p-3 rounded-2xl border border-slate-800/40 max-w-[90%]">
                    <div class="w-8 h-8 rounded-lg bg-slate-700 flex items-center justify-center font-bold text-xs text-slate-300">
                        ${name.charAt(0)}
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="${rankClass}">${rankClass === 'glow-owner' ? '<i class="fa-solid fa-crown text-[10px]"></i> ' : ''}${name}</span>
                            <span class="text-[9px] text-slate-500">الآن</span>
                        </div>
                        <p class="text-sm text-slate-300 leading-relaxed break-words">${messageText}</p>
                    </div>
                </div>
            `;
