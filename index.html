<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الدردشة الكتابية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #007bff;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.sent {
            background: #007bff;
            color: #fff;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            background: #e4e6eb;
            color: #333;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #fff;
            border-top: 1px solid #ddd;
        }
        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
            resize: none;
        }
        .send-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 0 18px;
            margin-right: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">غرفة دردشة مباشرة</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message received">أهلاً بك في غرفتك! اكتب رسالة لتجربة شاشة الإرسال.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button class="send-btn" id="sendBtn">إرسال</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    // دالة إضافة رسالة جديدة للشاشة
    function appendMessage(text, type) {
        if (text.trim() === '') return;

        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', type);
        messageDiv.textContent = text;
        
        chatMessages.appendChild(messageDiv);
        
        // التمرير التلقائي لأسفل المحادثة
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // معالجة حدث الإرسال
    function handleSend() {
        const messageText = chatInput.value;
        if(messageText.trim() !== "") {
            appendMessage(messageText, 'sent');
            chatInput.value = '';

            // محاكاة رد تلقائي بسيط بعد ثانية واحدة (للردود الواردة)
            setTimeout(() => {
                appendMessage("تم استلام رسالتك بنجاح! 👍", 'received');
            }, 1000);
        }
    }

    // تشغيل الإرسال عند النقر على الزر
    sendBtn.addEventListener('click', handleSend);

    // تشغيل الإرسال عند الضغط على زر Enter
    chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handleSend();
        }
    });
</script>

</body>
</html>
