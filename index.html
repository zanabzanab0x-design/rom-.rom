<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات غرف كرامه المميز</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; overflow: hidden; }
        
        #loginScreen { background: rgba(30, 41, 59, 0.9); padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        #loginScreen h2 { margin-bottom: 20px; color: #38bdf8; font-size: 1.8rem; }
        .login-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; font-size: 1rem; margin-bottom: 20px; text-align: center; }
        .login-btn { width: 100%; padding: 12px; border-radius: 25px; border: none; background: linear-gradient(90deg, #0284c7, #38bdf8); color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; }

        #appScreen { display: none; width: 100%; max-width: 900px; height: 85vh; background: #1e293b; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        
        .sidebar { width: 30%; background: #0f172a; padding: 15px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid rgba(255,255,255,0.05); }
        .sidebar h3 { font-size: 1.1rem; padding: 10px; color: #94a3b8; border-bottom: 1px solid #1e293b; }
        .room-btn { padding: 12px; background: #1e293b; border: none; border-radius: 10px; color: #cbd5e1; text-align: right; cursor: pointer; font-size: 0.95rem; font-weight: 500; }
        .room-btn:hover, .room-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .room-btn.karama-special { border-right: 4px solid #e11d48; }
        .room-btn.karama-special:hover, .room-btn.karama-special.active { background: #e11d48; color: #fff; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: #111827; }
        .chat-header { background: #1e293b; padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .chat-header.owner-mode { background: #e11d48; }

        #adminPanel { display: none; background: #881337; padding: 8px 15px; justify-content: space-around; gap: 5px; flex-wrap: wrap; }
        .admin-btn { background: #e11d48; color: white; border: 1px solid rgba(255,255,255,0.2); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }

        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; display: flex; flex-direction: column; }
        .message .sender { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; opacity: 0.7; }
        
        .message.sent { background: #0284c7; color: #fff; align-self: flex-start; border-top-right-radius: 2px; }
        .message.received { background: #334155; color: #f8fafc; align-self: flex-end; border-top-left-radius: 2px; }
        .message.owner { background: #e11d48; color: #fff; align-self: flex-start; border-top-right-radius: 2px; font-weight: bold; box-shadow: 0 4px 12px rgba(225,29,72,0.3); }
        .message.system { background: #fef08a; color: #854d0e; align-self: center; text-align: center; border-radius: 6px; font-size: 0.85rem; font-weight: 500; padding: 5px 10px; }

        .chat-input-area { display: flex; padding: 15px; background: #1e293b; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .chat-input { flex: 1; padding: 12px 18px; border: 1px solid #475569; border-radius: 25px; background: #0f172a; color: #fff; outline: none; font-size: 0.95rem; }
        .send-btn { background: #0284c7; color: white; border: none; padding: 0 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .send-btn.owner-mode { background: #e11d48; }
    </style>
    <!-- استدعاء ملف الاتصال الشبكي أونلاين من السيرفر -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="loginScreen">
    <h2>✨ شات غرف كرامه السحابي ✨</h2>
    <input type="text" class="login-input" id="usernameInput" placeholder="أدخل اسمك المستعار..." maxlength="15">
    <button class="login-btn" onclick="connectToServer()">دخول الدردشة</button>
</div>

<div id="appScreen">
    <div class="sidebar">
        <h3>🚪 غرف الدردشة</h3>
        <button class="room-btn karama-special active" onclick="switchRoom('غرفة كرامه الخاصة', this)">👑 غرفة كرامه الخاصة</button>
        <button class="room-btn" onclick="switchRoom('الغرفة العامة', this)">💬 الغرفة العامة</button>
        <button class="room-btn" onclick="switchRoom('غرفة المسابقات والتسلية', this)">🎮 المسابقات والتسلية</button>
    </div>

    <div class="chat-area">
        <div class="chat-header" id="chatHeader">👑 غرفة كرامه الخاصة</div>
        
        <!-- لوحة التحكم الكاملة لكرامه عبر السيرفر -->
        <div id="adminPanel">
            <button class="admin-btn" onclick="sendAdmin('clear')">🧹 مسح الشات</button>
            <button class="admin-btn" onclick="sendAdmin('lock')">🔒 قفل/فتح الكتابة</button>
            <button class="admin-btn" onclick="sendAdmin('mute')">🔇 كتم مستخدم</button>
            <button class="admin-btn" onclick="sendAdmin('unmute')">🔊 فك كتم</button>
            <button class="admin-btn" onclick="sendAdmin('kick')">🚷 طرد وحظر نِهائي</button>
            <button class="admin-btn" onclick="sendAdmin('alert')">📢 تنبيه للكل</button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
            <button class="send-btn" id="sendBtn" onclick="handleSend()">إرسال</button>
        </div>
    </div>
</div>

<script>
    let socket;
    let nickname = "";

    function connectToServer() {
        const userVal = document.getElementById('usernameInput').value.trim();
        if(!userVal) { alert("الرجاء كتابة اسم!"); return; }
        nickname = userVal;

        // الاتصال المباشر بالسيرفر أونلاين
        socket = io();

        socket.emit('checkLogin', { username: nickname });

        socket.on('authResult', (res) => {
            if(res.success) {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('appScreen').style.display = "flex";
                initSocketListeners();
            } else {
                alert("❌ تم طردك وحظرك نهائياً من قِبل المالك كرامه لا يمكنك الدخول!");
            }
        });
    }

    function initSocketListeners() {
        socket.on('newMessage', (data) => {
            let msgClass = 'received';
            if (data.sender === nickname || (nickname === "👑 المالك كرامه" && data.sender === "👑 المالك كرامه")) msgClass = 'sent';
            if (data.sender === "👑 المالك كرامه") msgClass = 'owner';
            if (data.sender === "النظام" || data.sender.startsWith("📢")) msgClass = 'system';

            const div = document.createElement('div');
            div.classList.add('message', msgClass);
            div.innerHTML = `<span class="sender">${data.sender}</span>${data.text}`;
            document.getElementById('chatMessages').appendChild(div);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        });

        socket.on('ownerVerified', (res) => {
            if(res.success) {
                nickname = res.name;
                document.getElementById('chatHeader').classList.add('owner-mode');
                document.getElementById('sendBtn').classList.add('owner-mode');
                document.getElementById('adminPanel').style.display = 'flex';
                document.getElementById('chatHeader').textContent = `👑 غرفة كرامه الخاصة (لوحة المالك نشطة)`;
            }
        });

        socket.on('roomChanged', (roomName) => {
            document.getElementById('chatHeader').textContent = nickname === "👑 المالك كرامه" ? `👑 ${roomName} (لوحة المالك نشطة)` : roomName;
            document.getElementById('chatMessages').innerHTML = `<div class="message system"><span class="sender">النظام</span> انتقلت إلى ${roomName}</div>`;
        });

        socket.on('adminCommand', (data) => {
            if(data.action === 'clear') document.getElementById('chatMessages').innerHTML = '';
            if(data.action === 'banned') { alert("❌ لقد قام المالك كرامه بطردك وحظرك من السيرفر!"); location.reload(); }
        });
    }

    function switchRoom(roomName, btn) {
        if(!socket) return;
        document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        socket.emit('joinRoom', roomName);
    }

    function handleSend() {
        const text = document.getElementById('chatInput').value.trim();
        if(!text) return;

        if(text === "12233") {
            socket.emit('verifyOwner', text);
            document.getElementById('chatInput').value = '';
            return;
        }

        socket.emit('sendMessage', { text: text });
        document.getElementById('chatInput').value = '';
    }

    function sendAdmin(action) {
        if(action === 'alert') {
            const txt = prompt("أدخل نص التنبيه العام:");
            if(txt) socket.emit('adminAction', { action: action, text: txt });
        } else if(action === 'mute' || action === 'unmute' || action === 'kick') {
